site_name: Spinfinity
site_description: Documentation of the Spinfinity Simulation Code

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false

nav:
  - Home: index.md
  - API Reference:
      - Spin System: api/spinsys.md
      - Spin Hamiltonian: api/spinhamiltonian.md
      - Bath: api/bath.md
      - dIdV: api/dIdV.md
      - Spin Pumping: api/spinpumping.md
      - ESR: api/esr.md