site_name: Spinfinity
site_description: Documentation of the Spinfinity Simulation Code

theme:
  name: material
  logo: assets/images/icon.png
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      allow_errors: false
      show_source: true
      include_requirejs: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
      - First Notebook: tutorials/example.ipynb
  - Documentation:
      - Overview: documentation.md
      - Spin System: api/spinsys.md
      - Spin Hamiltonian: api/spinhamiltonian.md
      - Bath: api/bath.md
      - dIdV: api/dIdV.md
      - Spin Pumping: api/spinpumping.md
      - ESR: api/esr.md