[project]
name = "spinfinity"
version = "1.0.0"
description = "Python package for simulating quantum spin systems in tunnel junction experiments in Scanning Probe Microscopy"
authors = [
    {name = "PaulGreule", email = "paul.greule@kit.edu"},
    {name = "JohannesSchwenk", email = "johannes.schwenk@kit.edu"}
]
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "numpy (>=2.3.0,<3.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "matplotlib",
    "plotly (>=6.1.2,<7.0.0)",
    "cma",
    "qutip",
    "joblib",
    "nbformat>=4.2.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs<2",
    "mkdocs-material==9.*",
    "mkdocstrings[python]",
    "mkdocs-jupyter"
]
test = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"