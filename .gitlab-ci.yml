stages:
  - lint
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "public"'
    - when: never

.base_ruff:
  stage: lint
  rules:
    - when: on_success
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.14.10-alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

Ruff Check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

Ruff Format:
  extends: .base_ruff
  script:
    - ruff format --check

Tests:
  stage: test
  rules:
    - when: on_success
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[test]"
  script:
    - python -m pytest